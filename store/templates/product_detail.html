<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }} - My Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f8f5f2;
        }

        .product-image {
            width: 100%;
            max-height: 550px;
            object-fit: cover;
            border-radius: 15px;
        }

        .price {
            color: #5a315d;
            font-size: 30px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-dark" style="background:#5a315d;">

    <div class="container">

        <a class="navbar-brand" href="/">
            My Store
        </a>

        <a class="btn btn-light" href="/cart/">
            🛒 Cart
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="row align-items-center">

        <div class="col-md-6">

            {% if product.image %}

            <img
                src="{{ product.image.url }}"
                class="product-image"
                alt="{{ product.name }}"
            >

            {% endif %}

        </div>


        <div class="col-md-6">

            <h1>{{ product.name }}</h1>

            <div class="price my-3">
                ₹{{ product.price }}
            </div>

            <p class="lead">
                {{ product.description }}
            </p>

            <p>
                <strong>Available Stock:</strong>
                {{ product.stock }}
            </p>


            <div class="d-grid gap-3">

                <a
                    href="{% url 'add_to_cart' product.id %}"
                    class="btn btn-lg"
                    style="background:#5a315d;color:white;"
                >
                    🛒 Add to Cart
                </a>


                <a
                    href="{% url 'buy_now' product.id %}"
                    class="btn btn-lg"
                    style="background:#d28b9b;color:white;"
                >
                    ⚡ Buy Now
                </a>


                <a
                    href="/"
                    class="btn btn-outline-dark"
                >
                    ← Continue Shopping
                </a>

            </div>

        </div>

    </div>

</div>


</body>

</html>
